<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passer commande - NEXUS 360</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000010;
    }

    h1 {
      text-align: center;
      color: #123b72;
    }

    h2 {
      margin-top: 25px;
      font-size: 19px;
    }

    .item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-info p {
      margin: 5px 0;
      overflow-wrap: anywhere;
    }

    .price {
      font-weight: bold;
      color: #123b72;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .total {
      margin-top: 24px;
      padding: 16px;
      background: #edf4ff;
      border-radius: 8px;
      font-size: 21px;
      font-weight: bold;
      text-align: center;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #123b72;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .success {
      background: #e3f8e8;
      color: #176b2c;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .hidden {
      display: none;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #123b72;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🛒 Finaliser ma commande</h1>

    <p>
      Complétez vos coordonnées pour recevoir votre commande.
      Aucun compte client n'est nécessaire.
    </p>

    <h2>Votre panier</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total : <span id="total">0</span>
    </div>

    <h2>Informations de livraison</h2>

    <form id="orderForm">

      <label for="customerName">Nom complet</label>
      <input
        id="customerName"
        type="text"
        minlength="2"
        maxlength="150"
        autocomplete="name"
        required
      >

      <label for="customerPhone">Numéro de téléphone</label>
      <input
        id="customerPhone"
        type="tel"
        minlength="6"
        maxlength="30"
        autocomplete="tel"
        required
      >

      <label for="deliveryAddress">Adresse de livraison</label>
      <textarea
        id="deliveryAddress"
        minlength="5"
        maxlength="500"
        autocomplete="street-address"
        placeholder="Commune, quartier, avenue, numéro..."
        required
      ></textarea>

      <button id="submitButton" type="submit">
        Confirmer ma commande
      </button>

    </form>

    <div id="message" class="message hidden" role="status"></div>

    <a class="back" href="catalogue.html">
      ← Retour au catalogue
    </a>

  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const CART_KEY = "nexus360_cart_v1";
    const CUSTOMER_KEY = "nexus360_customer_details_v1";

    const cartItems = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");
    const form = document.getElementById("orderForm");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let cart = [];

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function formatPrice(value) {
      return new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: 2
      }).format(value);
    }

    function loadCart() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );

        cart = Array.isArray(saved)
          ? saved.filter(item =>
              item &&
              typeof item.id === "string" &&
              Number.isInteger(Number(item.quantity)) &&
              Number(item.quantity) > 0
            )
          : [];
      } catch {
        cart = [];
      }
    }

    function displayCart() {
      cartItems.replaceChildren();

      let total = 0;

      if (cart.length === 0) {
        cartItems.textContent = "Votre panier est vide.";
        totalElement.textContent = "0";
        submitButton.disabled = true;
        return;
      }

      submitButton.disabled = false;

      cart.forEach(item => {
        const quantity = Number(item.quantity);
        const price = Number(item.price);
        const lineTotal = price * quantity;

        total += lineTotal;

        const row = document.createElement("div");
        row.className = "item";

        if (item.image_url) {
          const img = document.createElement("img");
          img.src = item.image_url;
          img.alt = "";
          img.loading = "lazy";
          img.onerror = () => img.remove();
          row.appendChild(img);
        }

        const info = document.createElement("div");
        info.className = "item-info";

        const name = document.createElement("p");
        name.textContent = item.name || "Produit";

        const quantityText = document.createElement("p");
        quantityText.textContent = "Quantité : " + quantity;

        const priceText = document.createElement("p");
        priceText.className = "price";
        priceText.textContent =
          formatPrice(lineTotal) + " FC";

        info.append(name, quantityText, priceText);
        row.appendChild(info);
        cartItems.appendChild(row);
      });

      totalElement.textContent = formatPrice(total) + " FC";
    }

    function loadCustomerDetails() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(CUSTOMER_KEY) || "{}"
        );

        document.getElementById("customerName").value =
          saved.name || "";

        document.getElementById("customerPhone").value =
          saved.phone || "";

        document.getElementById("deliveryAddress").value =
          saved.address || "";
      } catch {
        // Le formulaire reste utilisable si les données sont illisibles.
      }
    }

    loadCart();
    displayCart();
    loadCustomerDetails();

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (cart.length === 0) {
        showMessage("Votre panier est vide.", "error");
        return;
      }

      const customerName =
        document.getElementById("customerName").value.trim();

      const customerPhone =
        document.getElementById("customerPhone").value.trim();

      const deliveryAddress =
        document.getElementById("deliveryAddress").value.trim();

      const items = cart.map(item => ({
        product_id: item.id,
        quantity: Number(item.quantity)
      }));

      if (items.some(item =>
        !Number.isInteger(item.quantity) ||
        item.quantity < 1 ||
        item.quantity > 100
      )) {
        showMessage("Une quantité du panier est invalide.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Envoi en cours...";

      try {
        const { data, error } = await supabase.rpc(
          "create_guest_order",
          {
            p_customer_name: customerName,
            p_customer_phone: customerPhone,
            p_delivery_address: deliveryAddress,
            p_items: items
          }
        );

        if (error) {
          throw error;
        }

        if (!data || data.success !== true) {
          throw new Error("La commande n'a pas été confirmée.");
        }

        // Mémoriser les coordonnées sur cet appareil.
        try {
          localStorage.setItem(
            CUSTOMER_KEY,
            JSON.stringify({
              name: customerName,
              phone: customerPhone,
              address: deliveryAddress
            })
          );
        } catch {
          // La commande peut réussir même si le navigateur
          // refuse de mémoriser les coordonnées.
        }

        // Vider le panier après confirmation du serveur.
        localStorage.removeItem(CART_KEY);
        cart = [];
        displayCart();

        form.classList.add("hidden");

        showMessage(
          "Commande enregistrée ! Numéro : " +
          data.order_number +
          ". Total confirmé : " +
          formatPrice(Number(data.total_amount)) +
          " FC. Conservez ce numéro.",
          "success"
        );

      } catch (error) {
        console.error("Erreur de commande :", error);

        showMessage(
          "Impossible d'enregistrer la commande : " +
          (error.message || "erreur inconnue") +
          ". Votre panier a été conservé.",
          "error"
        );
      } finally {
        submitButton.disabled = cart.length === 0;
        submitButton.textContent = "Confirmer ma commande";
      }
    });
  </script>

</body>
  </html>
