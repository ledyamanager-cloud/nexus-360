<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b72">
  <title>Passer commande - NEXUS 360</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #243247;
    }

    .container {
      max-width: 650px;
      margin: 12px auto;
      padding: 22px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000012;
    }

    h1 {
      margin: 4px 0 12px;
      text-align: center;
      color: #123b72;
      font-size: 25px;
    }

    h2 {
      margin-top: 26px;
      color: #123b72;
      font-size: 19px;
    }

    .intro {
      text-align: center;
      color: #667085;
      line-height: 1.6;
    }

    .item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f4;
    }

    .item img {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-info p {
      margin: 5px 0;
      overflow-wrap: anywhere;
    }

    .price {
      color: #123b72;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
      color: #344054;
    }

    input, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #0759dc;
      box-shadow: 0 0 0 3px #0759dc15;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .total {
      margin-top: 22px;
      padding: 17px;
      background: #edf4ff;
      border: 1px solid #d9e7ff;
      border-radius: 11px;
      color: #123b72;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    button:active {
      transform: scale(.99);
    }

    button:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    .submit-button {
      margin-top: 24px;
      padding: 16px;
      background: #123b72;
      font-size: 17px;
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      background: #eaf8ef;
      color: #176b37;
    }

    .error {
      background: #fff0f0;
      color: #a00000;
      border: 1px solid #ffd0d0;
    }

    .hidden {
      display: none !important;
    }

    /* Confirmation générale */
    .success-heading {
      margin: 0 0 8px;
      color: #176b37;
      text-align: center;
      font-size: 21px;
    }

    .success-intro {
      text-align: center;
      margin: 8px 0 16px;
    }

    .grand-total {
      margin: 18px 0 24px;
      padding: 18px 12px;
      background: #e6f7ec;
      border: 1px solid #c6ebd2;
      border-radius: 12px;
      color: #176b37;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    /* Carte individuelle de chaque boutique */
    .order-card {
      margin: 22px 0;
      padding: 14px;
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      box-shadow: 0 4px 14px #0000000a;
    }

    .order-alert {
      margin: 0;
      padding: 20px 14px;
      border: 3px solid #b00000;
      border-radius: 12px;
      background: #fff0f0;
      color: #8f1515;
      text-align: center;
      animation: alertBlink 1.5s ease-in-out infinite;
    }

    .order-alert h2 {
      margin: 0 0 16px;
      color: #a00000;
      font-size: 20px;
    }

    .store-name {
      margin: 10px 0 16px;
      font-weight: bold;
    }

    .order-number-label {
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .order-number {
      display: block;
      margin: 10px 0 15px;
      padding: 12px 8px;
      border: 2px dashed #dc2626;
      border-radius: 9px;
      background: #fff;
      color: #991b1b;
      font-size: clamp(19px, 5vw, 25px);
      font-weight: 900;
      letter-spacing: .5px;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .confirmed-total {
      margin: 12px 0;
      font-size: 19px;
      font-weight: 900;
    }

    .order-reminder {
      margin: 12px 0 0;
      font-size: 13px;
    }

    @keyframes alertBlink {
      0%, 100% {
        border-color: #b00000;
        background: #fff0f0;
      }
      50% {
        border-color: #e12626;
        background: #ffe5e5;
      }
    }

    .copy-button {
      background: #b00000;
    }

    .tracking-button {
      background: #0759dc;
    }

    .payment-section {
      margin-top: 17px;
      padding: 15px;
      border: 1px solid #e1e7ef;
      border-radius: 11px;
      background: #fff;
    }

    .payment-section h3 {
      margin: 0 0 12px;
      color: #123b72;
      font-size: 16px;
    }

    .payment-choice {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border-radius: 8px;
      font-size: 14px;
    }

    .cash-choice {
      background: #15803d;
    }

    .electronic-choice {
      background: #d1d5db;
      color: #555;
      cursor: not-allowed;
    }

    .cash-confirmation {
      margin-top: 13px;
      padding: 12px;
      background: #e3f8e8;
      border-radius: 8px;
      color: #176b2c;
      font-size: 13px;
      line-height: 1.5;
    }

    .contact-title {
      margin-top: 17px;
      color: #123b72;
      font-weight: bold;
    }

    .contact-button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border-radius: 8px;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .whatsapp-button {
      background: #16a34a;
    }

    .call-button {
      background: #123b72;
    }

    .payment-info {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #667085;
      overflow-wrap: anywhere;
    }

    .payment-info a {
      color: #0759dc;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #123b72;
      font-weight: bold;
      text-decoration: none;
    }

    .copy-feedback {
      margin: 8px 0;
      text-align: center;
      font-size: 13px;
      color: #176b37;
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container {
        margin: 5px auto;
        padding: 15px;
        border-radius: 12px;
      }
      h1 { font-size: 22px; }
      .order-card { padding: 10px; }
      .order-alert { padding: 18px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .order-alert { animation: none; }
      button { transition: none; }
    }
  </style>
</head>

<body>
<main class="container">

  <h1>🛒 Finaliser ma commande</h1>

  <p class="intro">
    Complétez vos coordonnées pour recevoir votre commande.
    Aucun compte client n'est nécessaire.
  </p>

  <h2>Votre panier</h2>
  <div id="cartItems"></div>

  <div class="total">
    Total : <span id="total">0 FC</span>
  </div>

  <h2>Informations de livraison</h2>

  <form id="orderForm">
    <label for="customerName">Nom complet</label>
    <input id="customerName" type="text"
      minlength="2" maxlength="150"
      autocomplete="name" required>

    <label for="customerPhone">Numéro de téléphone</label>
    <input id="customerPhone" type="tel"
      minlength="6" maxlength="30"
      autocomplete="tel" required>

    <label for="deliveryAddress">Adresse de livraison</label>
    <textarea id="deliveryAddress"
      minlength="5" maxlength="500"
      autocomplete="street-address"
      placeholder="Commune, quartier, avenue, numéro..."
      required></textarea>

    <button id="submitButton"
      class="submit-button" type="submit">
      Confirmer ma commande
    </button>
  </form>

  <div id="message" class="message hidden"
    role="status" aria-live="polite"></div>

  <a class="back" href="./catalogue.html">
    ← Retour au catalogue
  </a>

</main>

<script type="module">
  import { supabase } from "./supabase.js";

  const CART_KEY = "nexus360_cart_v1";
  const CUSTOMER_KEY = "nexus360_customer_details_v1";

  const STORE_PHONE = "243966557344";
  const PAYMENT_EMAIL = "ngomafilscher@gmail.com";

  const cartItems = document.getElementById("cartItems");
  const totalElement = document.getElementById("total");
  const form = document.getElementById("orderForm");
  const submitButton = document.getElementById("submitButton");
  const message = document.getElementById("message");

  let cart = [];
  let isSubmitting = false;

  function showMessage(text, type) {
    message.replaceChildren();
    message.className = "message " + type;
    message.textContent = text;
  }

  function formatPrice(value) {
    return new Intl.NumberFormat("fr-FR", {
      maximumFractionDigits: 2
    }).format(Number(value) || 0);
  }

  function loadCart() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(CART_KEY) || "[]"
      );

      cart = Array.isArray(saved)
        ? saved.filter(item => {
            const productId = item?.product_id || item?.id;

            return (
              item &&
              typeof productId === "string" &&
              Number.isInteger(Number(item.quantity)) &&
              Number(item.quantity) > 0 &&
              Number.isFinite(Number(item.price)) &&
              Number(item.price) >= 0
            );
          }).map(item => ({
            ...item,
            id: item.product_id || item.id,
            quantity: Number(item.quantity),
            price: Number(item.price)
          }))
        : [];

    } catch {
      cart = [];
    }
  }

  function displayCart() {
    cartItems.replaceChildren();

    if (cart.length === 0) {
      cartItems.textContent = "Votre panier est vide.";
      totalElement.textContent = "0 FC";
      submitButton.disabled = true;
      return;
    }

    let total = 0;

    cart.forEach(item => {
      const lineTotal = item.price * item.quantity;
      total += lineTotal;

      const row = document.createElement("div");
      row.className = "item";

      if (item.image_url) {
        const img = document.createElement("img");
        img.src = item.image_url;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        row.appendChild(img);
      }

      const info = document.createElement("div");
      info.className = "item-info";

      const name = document.createElement("p");
      name.textContent =
        item.name || item.product_name || "Produit";

      const quantity = document.createElement("p");
      quantity.textContent = "Quantité : " + item.quantity;

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = formatPrice(lineTotal) + " FC";

      info.append(name, quantity, price);
      row.appendChild(info);
      cartItems.appendChild(row);
    });

    totalElement.textContent = formatPrice(total) + " FC";
    submitButton.disabled = false;
  }

  function loadCustomerDetails() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(CUSTOMER_KEY) || "{}"
      );

      document.getElementById("customerName").value =
        saved.name || "";

      document.getElementById("customerPhone").value =
        saved.phone || "";

      document.getElementById("deliveryAddress").value =
        saved.address || "";

    } catch {
      // Le formulaire reste utilisable.
    }
  }

  async function copyOrderDetails(details, button) {
    const originalText = button.textContent;
    let copied = false;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(details);
        copied = true;
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = details;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        copied = document.execCommand("copy");
        textarea.remove();
      }
    } catch {
      copied = false;
    }

    button.textContent = copied
      ? "✅ Détails copiés !"
      : "Copie impossible : sélectionnez les détails.";

    setTimeout(() => {
      button.textContent = originalText;
    }, 3000);
  }

  function createOrderCard(
    order,
    customerName,
    customerPhone,
    customerAddress
  ) {
    const wrapper = document.createElement("section");
    wrapper.className = "order-card";

    const alertBox = document.createElement("div");
    alertBox.className = "order-alert";

    const title = document.createElement("h2");
    title.textContent = "🚨 COMMANDE CONFIRMÉE !";

    const store = document.createElement("p");
    store.className = "store-name";
    store.textContent = "Boutique : " + order.store_name;

    const numberLabel = document.createElement("p");
    numberLabel.className = "order-number-label";
    numberLabel.textContent = "NUMÉRO DE COMMANDE :";

    const number = document.createElement("span");
    number.className = "order-number";
    number.textContent = order.order_number;

    const amount = document.createElement("p");
    amount.className = "confirmed-total";
    amount.textContent =
      "Montant : " + formatPrice(order.total_amount) + " FC";

    const advice = document.createElement("p");
    advice.className = "order-reminder";
    advice.textContent =
      "⚠️ Conservez ce numéro pour suivre cette commande.";

    alertBox.append(
      title, store, numberLabel, number, amount, advice
    );

    const details =
      "COMMANDE NEXUS 360\n" +
      "Boutique : " + order.store_name + "\n" +
      "Numéro de commande : " + order.order_number + "\n" +
      "Montant : " + formatPrice(order.total_amount) + " FC\n" +
      "Client : " + customerName + "\n" +
      "Téléphone : " + customerPhone + "\n" +
      "Adresse : " + customerAddress + "\n" +
      "Paiement : après livraison.";

    const copyButton = document.createElement("button");
    copyButton.type = "button";
    copyButton.className = "copy-button";
    copyButton.textContent = "📋 Copier cette commande";

    copyButton.addEventListener("click", () => {
      copyOrderDetails(details, copyButton);
    });

    const trackingButton = document.createElement("button");
    trackingButton.type = "button";
    trackingButton.className = "tracking-button";
    trackingButton.textContent = "📦 Suivre cette commande";

    trackingButton.addEventListener("click", () => {
      window.location.href =
        "./suivi-commande.html?numero=" +
        encodeURIComponent(order.order_number);
    });

    const paymentSection = document.createElement("section");
    paymentSection.className = "payment-section";

    const paymentTitle = document.createElement("h3");
    paymentTitle.textContent = "💳 Mode de paiement";

    const cashButton = document.createElement("button");
    cashButton.type = "button";
    cashButton.className = "payment-choice cash-choice";
    cashButton.textContent = "💵 Payer après livraison";

    const electronicButton = document.createElement("button");
    electronicButton.type = "button";
    electronicButton.className =
      "payment-choice electronic-choice";
    electronicButton.disabled = true;
    electronicButton.textContent =
      "💳 Paiement électronique – Bientôt disponible";

    const cashConfirmation = document.createElement("div");
    cashConfirmation.className =
      "cash-confirmation hidden";
    cashConfirmation.textContent =
      "✅ Vous avez choisi de payer en espèces après livraison. " +
      "Veuillez remettre le montant au vendeur à la réception.";

    const contactTitle = document.createElement("p");
    contactTitle.className = "contact-title hidden";
    contactTitle.textContent =
      "📞 Contacter la boutique " + order.store_name + " :";

    const whatsapp = document.createElement("a");
    whatsapp.className =
      "contact-button whatsapp-button hidden";

    const whatsappMessage =
      "Bonjour " + order.store_name + " !\n\n" +
      "Je viens de passer une commande sur NEXUS 360.\n" +
      "Numéro : " + order.order_number + "\n" +
      "Montant : " + formatPrice(order.total_amount) + " FC\n" +
      "Client : " + customerName + "\n" +
      "Téléphone : " + customerPhone + "\n" +
      "Adresse : " + customerAddress + "\n\n" +
      "Je souhaiterais avoir des informations sur la livraison. Merci !";

    whatsapp.href =
      "https://wa.me/" + STORE_PHONE +
      "?text=" + encodeURIComponent(whatsappMessage);

    whatsapp.target = "_blank";
    whatsapp.rel = "noopener noreferrer";
    whatsapp.textContent = "🟢 Contacter sur WhatsApp";

    const call = document.createElement("a");
    call.className = "contact-button call-button hidden";
    call.href = "tel:+" + STORE_PHONE;
    call.textContent = "📞 Appeler directement";

    cashButton.addEventListener("click", () => {
      cashButton.disabled = true;
      cashButton.textContent =
        "✅ Paiement après livraison choisi";

      cashConfirmation.classList.remove("hidden");
      contactTitle.classList.remove("hidden");
      whatsapp.classList.remove("hidden");
      call.classList.remove("hidden");
    });

    paymentSection.append(
      paymentTitle,
      cashButton,
      electronicButton,
      cashConfirmation,
      contactTitle,
      whatsapp,
      call
    );

    wrapper.append(
      alertBox,
      copyButton,
      trackingButton,
      paymentSection
    );

    return { wrapper, details };
  }

  function showSuccess(
    orders,
    grandTotal,
    customerName,
    customerPhone,
    customerAddress
  ) {
    message.replaceChildren();
    message.className = "message success";

    const heading = document.createElement("h2");
    heading.className = "success-heading";
    heading.textContent = "🎉 Toutes vos commandes sont confirmées !";

    const intro = document.createElement("p");
    intro.className = "success-intro";
    intro.textContent =
      orders.length === 1
        ? "Votre commande a bien été enregistrée."
        : orders.length +
          " commandes ont été enregistrées, une par boutique.";

    const total = document.createElement("div");
    total.className = "grand-total";
    total.textContent =
      "TOTAL GÉNÉRAL : " + formatPrice(grandTotal) + " FC";

    message.append(heading, intro, total);

    let allDetails = "RÉCAPITULATIF NEXUS 360\n\n";

    orders.forEach(order => {
      const result = createOrderCard(
        order,
        customerName,
        customerPhone,
        customerAddress
      );

      message.appendChild(result.wrapper);
      allDetails += result.details + "\n\n";
    });

    allDetails +=
      "TOTAL GÉNÉRAL : " + formatPrice(grandTotal) + " FC\n";

    const copyAllButton = document.createElement("button");
    copyAllButton.type = "button";
    copyAllButton.className = "copy-button";
    copyAllButton.textContent = "📋 Copier toutes mes commandes";

    copyAllButton.addEventListener("click", () => {
      copyOrderDetails(allDetails, copyAllButton);
    });

    const trackingButton = document.createElement("button");
    trackingButton.type = "button";
    trackingButton.className = "tracking-button";
    trackingButton.textContent =
      "📦 Accéder au suivi des commandes";

    trackingButton.addEventListener("click", () => {
      window.location.href = "./suivi-commande.html";
    });

    const emailInfo = document.createElement("p");
    emailInfo.className = "payment-info";
    emailInfo.textContent =
      "Pour toute information sur le paiement électronique : ";

    const emailLink = document.createElement("a");
    emailLink.href = "mailto:" + PAYMENT_EMAIL;
    emailLink.textContent = PAYMENT_EMAIL;

    emailInfo.appendChild(emailLink);

    message.append(copyAllButton, trackingButton, emailInfo);
    message.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  loadCart();
  displayCart();
  loadCustomerDetails();

  form.addEventListener("submit", async event => {
    event.preventDefault();

    if (isSubmitting) return;

    if (cart.length === 0) {
      showMessage("Votre panier est vide.", "error");
      return;
    }

    const customerName =
      document.getElementById("customerName").value.trim();

    const customerPhone =
      document.getElementById("customerPhone").value.trim();

    const deliveryAddress =
      document.getElementById("deliveryAddress").value.trim();

    if (
      customerName.length < 2 ||
      customerPhone.length < 6 ||
      deliveryAddress.length < 5
    ) {
      showMessage(
        "Vérifiez votre nom, votre téléphone et votre adresse.",
        "error"
      );
      return;
    }

    const items = cart.map(item => ({
      product_id: item.id,
      quantity: item.quantity
    }));

    if (items.some(item =>
      !item.product_id ||
      !Number.isInteger(item.quantity) ||
      item.quantity < 1 ||
      item.quantity > 100
    )) {
      showMessage(
        "Une quantité ou un produit du panier est invalide.",
        "error"
      );
      return;
    }

    isSubmitting = true;
    submitButton.disabled = true;
    submitButton.textContent = "Envoi des commandes...";
    message.className = "message hidden";

    try {
      const { data, error } = await supabase.rpc(
        "create_guest_multi_store_order",
        {
          p_customer_name: customerName,
          p_customer_phone: customerPhone,
          p_delivery_address: deliveryAddress,
          p_items: items
        }
      );

      if (error) throw error;

      if (
        !data ||
        data.success !== true ||
        !Array.isArray(data.orders) ||
        data.orders.length === 0
      ) {
        throw new Error(
          "Le serveur n'a pas renvoyé la confirmation complète des commandes."
        );
      }

      const orders = data.orders;

      if (orders.some(order =>
        !order.order_number ||
        !order.store_name ||
        !Number.isFinite(Number(order.total_amount))
      )) {
        throw new Error(
          "Le récapitulatif des commandes est incomplet. " +
          "Ne validez pas une deuxième fois. Contactez l'administrateur."
        );
      }

      const grandTotal = Number(data.total_amount);

      if (!Number.isFinite(grandTotal)) {
        throw new Error(
          "Le montant total renvoyé par le serveur est invalide. " +
          "Ne validez pas une deuxième fois."
        );
      }

      try {
        localStorage.setItem(
          CUSTOMER_KEY,
          JSON.stringify({
            name: customerName,
            phone: customerPhone,
            address: deliveryAddress
          })
        );
      } catch {}

      try {
        localStorage.removeItem(CART_KEY);
      } catch {}

      cart = [];
      displayCart();
      form.classList.add("hidden");

      showSuccess(
        orders,
        grandTotal,
        customerName,
        customerPhone,
        deliveryAddress
      );

    } catch (error) {
      console.error("Erreur de commande :", error);

      showMessage(
        error.message ||
        "Impossible de confirmer les commandes.",
        "error"
      );

    } finally {
      isSubmitting = false;

      if (!form.classList.contains("hidden")) {
        submitButton.textContent = "Confirmer ma commande";
        submitButton.disabled = cart.length === 0;
      }
    }
  });
</script>
</body>
</html>
