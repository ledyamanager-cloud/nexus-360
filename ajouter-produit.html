<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un produit - NEXUS 360</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 { color: #fca311; margin: 0; }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000012;
    }

    label {
      display: block;
      margin-top: 17px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea { min-height: 100px; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: #fca311;
      color: #14213d;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    button:disabled { opacity: 0.6; }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #e2e3e5; color: #383d41; }

    #preview {
      max-width: 100%;
      max-height: 250px;
      margin-top: 12px;
      display: none;
      border-radius: 8px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #14213d;
    }
  </style>
</head>

<body>
  <header>
    <h1>NEXUS 360</h1>
    <p>Publie tes produits en ligne</p>
  </header>

  <main>
    <section class="card">
      <h2>📦 Ajouter un produit</h2>
      <p>Remplis les informations de ton produit.</p>

      <form id="productForm">
        <label for="productName">Nom du produit *</label>
        <input id="productName" maxlength="150" required
               placeholder="Ex. : Chaussures élégantes">

        <label for="description">Description</label>
        <textarea id="description" maxlength="3000"
                  placeholder="Décris ton produit..."></textarea>

        <label for="price">Prix *</label>
        <input id="price" type="number" min="0" step="0.01"
               required placeholder="Ex. : 25000">

        <label for="stock">Quantité en stock *</label>
        <input id="stock" type="number" min="0" step="1"
               value="1" required>

        <label for="photo">Photo du produit</label>
        <input id="photo" type="file" accept="image/*">
        <img id="preview" alt="Aperçu du produit">

        <button id="saveButton" type="submit" disabled>
          Publier le produit
        </button>
      </form>

      <div id="message" class="info" role="status" aria-live="polite">
        Vérification de ta connexion...
      </div>

      <a href="./boutique.html">← Retour à ma boutique</a>
      <br>
      <a href="./catalogue.html">Voir le catalogue →</a>
    </section>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("productForm");
    const nameInput = document.getElementById("productName");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const stockInput = document.getElementById("stock");
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const button = document.getElementById("saveButton");
    const message = document.getElementById("message");

    let currentUser = null;
    let currentStore = null;
    let ready = false;

    function showMessage(text, type = "info") {
      message.textContent = text;
      message.className = type;
    }

    async function initialize() {
      button.disabled = true;

      try {
        const { data, error } = await supabase.auth.getUser();

        if (error) throw error;

        if (!data.user) {
          showMessage(
            "Connecte-toi à NEXUS 360 avant de publier un produit.",
            "error"
          );
          return;
        }

        currentUser = data.user;

        const { data: store, error: storeError } = await supabase
          .from("stores")
          .select("id, store_name")
          .eq("owner_id", currentUser.id)
          .maybeSingle();

        if (storeError) throw storeError;

        if (!store) {
          showMessage(
            "Tu dois d'abord créer ta boutique avant d'ajouter un produit.",
            "error"
          );
          return;
        }

        currentStore = store;
        ready = true;
        button.disabled = false;

        showMessage(
          "Boutique trouvée : " + store.store_name +
          ". Tu peux ajouter un produit.",
          "success"
        );
      } catch (error) {
        console.error(error);
        showMessage(
          "Vérification impossible : " + error.message,
          "error"
        );
      }
    }

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];

      if (!file) {
        preview.style.display = "none";
        preview.removeAttribute("src");
        return;
      }

      if (!file.type.startsWith("image/")) {
        photoInput.value = "";
        preview.style.display = "none";
        showMessage("Choisis un fichier image valide.", "error");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        photoInput.value = "";
        preview.style.display = "none";
        showMessage("La photo ne doit pas dépasser 5 Mo.", "error");
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      showMessage("Photo sélectionnée.", "info");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!ready || !currentUser || !currentStore) {
        showMessage(
          "La connexion ou la boutique n'est pas prête. Recharge la page.",
          "error"
        );
        return;
      }

      const productName = nameInput.value.trim();
      const price = Number(priceInput.value);
      const stock = Number(stockInput.value);
      const imageFile = photoInput.files[0];

      if (
        !productName ||
        !Number.isFinite(price) ||
        price < 0 ||
        !Number.isInteger(stock) ||
        stock < 0
      ) {
        showMessage(
          "Vérifie le nom, le prix et la quantité en stock.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Publication en cours...";

      let uploadedFilePath = null;

      try {
        let imageUrl = "";

        if (imageFile) {
          const safeName = imageFile.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

          uploadedFilePath =
            `${currentUser.id}/${Date.now()}-${safeName}`;

          const { error: uploadError } = await supabase.storage
            .from("product-images")
            .upload(uploadedFilePath, imageFile);

          if (uploadError) throw uploadError;

          const { data: publicData } = supabase.storage
            .from("product-images")
            .getPublicUrl(uploadedFilePath);

          imageUrl = publicData.publicUrl;
        }

        const { data, error } = await supabase
          .from("products")
          .insert({
            store_id: currentStore.id,
            product_name: productName,
            description: descriptionInput.value.trim(),
            price: price,
            stock: stock,
            image_url: imageUrl
          })
          .select()
          .single();

        if (error) throw error;

        form.reset();
        preview.style.display = "none";
        preview.removeAttribute("src");

        showMessage(
          "Produit publié avec succès !" +
          (imageUrl ? " Sa photo a été enregistrée." : " Sans photo.") +
          " Identifiant : " + data.id,
          "success"
        );
      } catch (error) {
        console.error(error);

        if (uploadedFilePath) {
          const { error: cleanupError } = await supabase.storage
            .from("product-images")
            .remove([uploadedFilePath]);

          if (cleanupError) {
            console.error(
              "Impossible de nettoyer la photo après l'erreur :",
              cleanupError
            );
          }
        }

        showMessage(
          "Erreur lors de la publication : " + error.message,
          "error"
        );
      } finally {
        button.disabled = !ready;
        button.textContent = "Publier le produit";
      }
    });

    initialize();
  </script>
</body>
</html>
