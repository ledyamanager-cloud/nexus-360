<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi de commande - NEXUS 360</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #123c69;
    }

    .intro {
      text-align: center;
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #123c69;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .card {
      background: #f8fafc;
      padding: 15px;
      margin-top: 12px;
      border-radius: 9px;
      border: 1px solid #e2e8f0;
    }

    .card p {
      margin: 9px 0;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: bold;
    }

    .item {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #123c69;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📦 Suivi de commande</h1>

    <p class="intro">
      Retrouvez les informations et l'évolution de votre commande
      sur NEXUS 360.
    </p>

    <form id="trackingForm">
      <label for="orderNumber">Numéro de commande</label>
      <input
        type="text"
        id="orderNumber"
        placeholder="Ex : 20261030-001B-6"
        required
      >

      <label for="phone">Numéro de téléphone utilisé lors de l'achat</label>
      <input
        type="tel"
        id="phone"
        placeholder="Ex : +243..."
        required
      >

      <button type="submit" id="searchButton">
        Rechercher ma commande
      </button>
    </form>

    <div id="message"></div>

    <section id="result">
      <h2>Informations de votre commande</h2>

      <div class="card" id="orderInfo"></div>

      <div class="card">
        <h3>Produits commandés</h3>
        <div id="itemsList"></div>
      </div>
    </section>

    <a href="index.html" class="back">← Retour à l'accueil</a>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("trackingForm");
    const button = document.getElementById("searchButton");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const orderInfo = document.getElementById("orderInfo");
    const itemsList = document.getElementById("itemsList");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function formatAmount(amount) {
      return Number(amount).toLocaleString("fr-FR") + " FC";
    }

    function formatDate(date) {
      return new Date(date).toLocaleString("fr-FR", {
        dateStyle: "long",
        timeStyle: "short"
      });
    }

    function statusLabel(status) {
      const labels = {
        pending: "En attente",
        confirmed: "Confirmée",
        preparing: "En préparation",
        shipped: "Expédiée",
        delivered: "Livrée",
        cancelled: "Annulée"
      };

      return labels[status] || status || "En attente";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.style.display = "none";
      message.className = "";
      message.style.display = "none";
      button.disabled = true;
      button.textContent = "Recherche en cours...";

      try {
        const orderNumber = document.getElementById("orderNumber").value.trim();
        const phone = document.getElementById("phone").value.trim();

        const { data, error } = await supabase.rpc(
          "get_guest_order_tracking",
          {
            p_order_number: orderNumber,
            p_customer_phone: phone
          }
        );

        if (error) throw error;

        if (!data) {
          showMessage(
            "Aucune commande trouvée. Vérifiez votre numéro de commande et votre téléphone.",
            "error"
          );
          return;
        }

        orderInfo.replaceChildren();

        const details = [
          ["Numéro de commande", data.order_number],
          ["Client", data.customer_name],
          ["Boutique", data.store_name || "NEXUS 360"],
          ["Téléphone", data.customer_phone],
          ["Adresse de livraison", data.delivery_address],
          ["Montant total", formatAmount(data.total_amount)],
          ["Statut", statusLabel(data.status)],
          ["Date de commande", formatDate(data.created_at)]
        ];

        details.forEach(([label, value]) => {
          const p = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + " : ";
          p.append(strong, document.createTextNode(value || "Non renseigné"));
          orderInfo.appendChild(p);
        });

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = statusLabel(data.status);
        orderInfo.appendChild(status);

        itemsList.replaceChildren();

        (data.items || []).forEach(item => {
          const div = document.createElement("div");
          div.className = "item";

          const name = document.createElement("strong");
          name.textContent = item.product_name;

          const info = document.createElement("p");
          info.textContent =
            "Quantité : " + item.quantity +
            " | Prix : " + formatAmount(item.unit_price);

          div.append(name, info);
          itemsList.appendChild(div);
        });

        result.style.display = "block";
        showMessage("Commande retrouvée avec succès !", "success");

      } catch (error) {
        console.error(error);
        showMessage(
          "Une erreur est survenue pendant la recherche. Réessayez.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Rechercher ma commande";
      }
    });
  </script>
</body>
</html>
