<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi de commande - NEXUS 360</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #123c69;
    }

    h2 { color: #123c69; }

    .intro {
      text-align: center;
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #123c69;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .card {
      background: #f8fafc;
      padding: 18px;
      margin-top: 15px;
      border-radius: 9px;
      border: 1px solid #e2e8f0;
    }

    .card p {
      margin: 9px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1e40af;
      font-weight: bold;
    }

    /* Frise chronologique */

    .timeline {
      margin-top: 25px;
      padding: 10px 5px;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 15px;
      min-height: 105px;
    }

    .timeline-left {
      width: 35px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timeline-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      color: #64748b;
      font-size: 17px;
      z-index: 1;
    }

    .timeline-line {
      width: 4px;
      flex: 1;
      min-height: 55px;
      background: #e2e8f0;
    }

    .timeline-content {
      padding-bottom: 25px;
    }

    .timeline-content h3 {
      margin: 5px 0;
      color: #64748b;
      font-size: 16px;
    }

    .timeline-content p {
      margin: 5px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .timeline-item.completed .timeline-icon {
      background: #16a34a;
      color: white;
    }

    .timeline-item.completed .timeline-line {
      background: #16a34a;
    }

    .timeline-item.completed h3 {
      color: #15803d;
    }

    .timeline-item.completed .timeline-content p {
      color: #475569;
    }

    .timeline-item.current .timeline-icon {
      background: #2563eb;
      color: white;
      box-shadow: 0 0 0 5px #dbeafe;
    }

    .timeline-item.current h3 {
      color: #1d4ed8;
      font-weight: bold;
    }

    .timeline-item:last-child {
      min-height: 65px;
    }

    .timeline-item:last-child .timeline-line {
      display: none;
    }

    .payment-status {
      padding: 14px;
      border-radius: 9px;
      background: #fff7ed;
      color: #9a3412;
      line-height: 1.5;
      font-weight: bold;
    }

    .payment-status.paid {
      background: #dcfce7;
      color: #166534;
    }

    .item {
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #123c69;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px;
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>📦 Suivi de commande</h1>

    <p class="intro">
      Suivez votre colis étape par étape grâce à NEXUS 360.
    </p>

    <form id="trackingForm">

      <label for="orderNumber">Numéro de commande</label>
      <input
        type="text"
        id="orderNumber"
        placeholder="Ex : 20261030-001B-6"
        required
      >

      <label for="phone">Téléphone utilisé lors de l'achat</label>
      <input
        type="tel"
        id="phone"
        placeholder="Ex : +243..."
        required
      >

      <button type="submit" id="searchButton">
        Rechercher ma commande
      </button>

    </form>

    <div id="message"></div>

    <section id="result">

      <h2>📋 Informations de la commande</h2>

      <div class="card" id="orderInfo"></div>

      <div class="card">
        <h2>🚚 Progression de la livraison</h2>

        <p>
          Les étapes se mettent à jour selon l'avancement réel
          de votre colis.
        </p>

        <div class="timeline" id="timeline"></div>
      </div>

      <div class="card">
        <h2>💰 État du paiement</h2>
        <div id="paymentInfo"></div>
      </div>

      <div class="card">
        <h2>🛍️ Produits commandés</h2>
        <div id="itemsList"></div>
      </div>

    </section>

    <a href="index.html" class="back">
      ← Retour à l'accueil
    </a>

  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("trackingForm");
    const button = document.getElementById("searchButton");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const orderInfo = document.getElementById("orderInfo");
    const itemsList = document.getElementById("itemsList");
    const timeline = document.getElementById("timeline");
    const paymentInfo = document.getElementById("paymentInfo");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.style.display = "block";
    }

    function formatAmount(amount) {
      return Number(amount).toLocaleString("fr-FR") + " FC";
    }

    function formatDate(date) {
      if (!date) return "En attente";

      return new Date(date).toLocaleString("fr-FR", {
        dateStyle: "short",
        timeStyle: "short",
        timeZone: "Africa/Kinshasa"
      });
    }

    function statusLabel(status) {
      const labels = {
        pending: "En attente",
        confirmed: "Confirmée",
        preparing: "En préparation",
        shipped: "Expédiée",
        delivered: "Livrée",
        cancelled: "Annulée"
      };

      return labels[status] || status || "En attente";
    }

    function buildTimeline(data) {
      const steps = [
        {
          title: "Colis en attente",
          description: "Votre commande est enregistrée et attend sa préparation.",
          icon: "📦",
          date: data.pending_at || data.created_at,
          states: ["pending"]
        },
        {
          title: "Colis en route",
          description: "Votre colis a été remis au livreur.",
          icon: "🚚",
          date: data.in_transit_at,
          states: ["in_transit"]
        },
        {
          title: "Colis arrivé",
          description: "Votre colis est arrivé à destination.",
          icon: "📍",
          date: data.arrived_at,
          states: ["arrived"]
        },
        {
          title: "Colis livré",
          description: "Votre colis a été remis au client.",
          icon: "✅",
          date: data.delivered_at,
          states: ["delivered"]
        }
      ];

      const currentStatus = data.delivery_status || "pending";

      const currentIndex = {
        pending: 0,
        in_transit: 1,
        arrived: 2,
        delivered: 3
      }[currentStatus];

      timeline.replaceChildren();

      steps.forEach((step, index) => {
        const item = document.createElement("div");
        item.className = "timeline-item";

        if (currentIndex !== undefined && index < currentIndex) {
          item.classList.add("completed");
        } else if (currentIndex !== undefined && index === currentIndex) {
          item.classList.add("current");
        }

        const left = document.createElement("div");
        left.className = "timeline-left";

        const icon = document.createElement("div");
        icon.className = "timeline-icon";
        icon.textContent = step.icon;

        const line = document.createElement("div");
        line.className = "timeline-line";

        left.append(icon, line);

        const content = document.createElement("div");
        content.className = "timeline-content";

        const title = document.createElement("h3");
        title.textContent = step.title;

        const description = document.createElement("p");
        description.textContent = step.description;

        const date = document.createElement("p");
        date.textContent = step.date
          ? "🕒 " + formatDate(step.date)
          : "🕒 Heure à venir";

        content.append(title, description, date);
        item.append(left, content);
        timeline.appendChild(item);
      });

      if (currentStatus === "cancelled") {
        const warning = document.createElement("p");
        warning.textContent = "⚠️ Cette commande a été annulée.";
        warning.style.color = "#b91c1c";
        timeline.appendChild(warning);
      }
    }

    function buildPaymentInfo(data) {
      paymentInfo.replaceChildren();

      const paid = data.payment_status === "paid";

      const box = document.createElement("div");
      box.className = paid
        ? "payment-status paid"
        : "payment-status";

      box.textContent = paid
        ? "✅ Paiement confirmé" +
          (data.paid_at ? " le " + formatDate(data.paid_at) : "")
        : "⏳ Paiement en attente de confirmation.";

      paymentInfo.appendChild(box);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.style.display = "none";
      message.className = "";
      message.style.display = "none";

      button.disabled = true;
      button.textContent = "Recherche en cours...";

      try {
        const orderNumber =
          document.getElementById("orderNumber").value.trim();

        const phone =
          document.getElementById("phone").value.trim();

        const { data, error } = await supabase.rpc(
          "get_guest_order_tracking",
          {
            p_order_number: orderNumber,
            p_customer_phone: phone
          }
        );

        if (error) throw error;

        if (!data) {
          showMessage(
            "Aucune commande trouvée. Vérifiez votre numéro de commande et votre téléphone.",
            "error"
          );
          return;
        }

        orderInfo.replaceChildren();

        const details = [
          ["Numéro de commande", data.order_number],
          ["Client", data.customer_name],
          ["Boutique", data.store_name || "NEXUS 360"],
          ["Téléphone", data.customer_phone],
          ["Adresse de livraison", data.delivery_address],
          ["Montant total", formatAmount(data.total_amount)],
          ["Statut de livraison", statusLabel(data.delivery_status)],
          ["Date de commande", formatDate(data.created_at)]
        ];

        details.forEach(([label, value]) => {
          const p = document.createElement("p");

          const strong = document.createElement("strong");
          strong.textContent = label + " : ";

          p.append(
            strong,
            document.createTextNode(value || "Non renseigné")
          );

          orderInfo.appendChild(p);
        });

        buildTimeline(data);
        buildPaymentInfo(data);

        itemsList.replaceChildren();

        (data.items || []).forEach(item => {
          const div = document.createElement("div");
          div.className = "item";

          const name = document.createElement("strong");
          name.textContent = item.product_name;

          const info = document.createElement("p");
          info.textContent =
            "Quantité : " + item.quantity +
            " | Prix : " + formatAmount(item.unit_price);

          div.append(name, info);
          itemsList.appendChild(div);
        });

        result.style.display = "block";

        showMessage(
          "Commande retrouvée avec succès !",
          "success"
        );

      } catch (error) {
        console.error(error);

        showMessage(
          "Une erreur est survenue pendant la recherche. Réessayez.",
          "error"
        );

      } finally {
        button.disabled = false;
        button.textContent = "Rechercher ma commande";
      }
    });
  </script>
</body>
</html>
